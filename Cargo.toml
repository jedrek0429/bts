[workspace]
members = [
    "bts-compat",
    "bts-install",
    "bts-core",
    "bts-display",
    "bts-protocol",
    "bts-terminal",
    "bts-telephony",
    "bts-addons",
]
resolver = "3"

[workspace.package]
version = "0.3.0-dev.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
bts-compat = { path = "bts-compat" }
asterisk-ari = "0.3.0"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
eframe = { version = "0.32", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
] }
futures-util = "0.3"
hex = "0.4"
libc = "0.2"
reqwest = { version = "0.12", features = ["json"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.27"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zstd = "0.13"
