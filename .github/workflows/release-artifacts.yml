name: Build release artifacts

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      prerelease:
        required: true
        type: boolean
      ref:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-artifacts-${{ inputs.version }}

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release identity
        env:
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          version=${VERSION#v}
          scripts/release-version.py check-workspace
          workspace_version=$(scripts/release-version.py workspace-version)
          [[ "$version" == "$workspace_version" ]] || { echo "Release $version does not match workspace version $workspace_version." >&2; exit 1; }
          kind=$(scripts/release-version.py classify "$version")
          [[ "$kind" != development ]] || { echo "Development versions cannot be published." >&2; exit 1; }
          if [[ "$kind" == stable ]]; then [[ "$PRERELEASE" == false ]]; else [[ "$PRERELEASE" == true ]]; fi

  linux-x86_64:
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build and bundle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libudev-dev libfontconfig1-dev zstd
      - name: Build installer and components
        run: cargo build --locked --release --workspace
      - name: Build release assets
        run: |
          assets="$RUNNER_TEMP/release-assets"
          install -d "$assets"
          for component in core display telephony addons cli; do
            binary="bts-$component"
            [[ "$component" == cli ]] && binary=btscli
            scripts/build-release component "$component" x86_64 "target/release/$binary" "$assets"
          done
          scripts/build-release installer x86_64 target/release/bts-install "$assets"
          printf 'ASSET_DIRECTORY=%s\n' "$assets" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: bts-linux-x86_64
          path: ${{ env.ASSET_DIRECTORY }}
          if-no-files-found: error

  linux-aarch64:
    needs: validate-version
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build and bundle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libudev-dev libfontconfig1-dev zstd
      - name: Build installer and components
        run: cargo build --locked --release --workspace
      - name: Build release assets
        run: |
          assets="$RUNNER_TEMP/release-assets"
          install -d "$assets"
          for component in core display telephony addons cli; do
            binary="bts-$component"
            [[ "$component" == cli ]] && binary=btscli
            scripts/build-release component "$component" aarch64 "target/release/$binary" "$assets"
          done
          scripts/build-release installer aarch64 target/release/bts-install "$assets"
          printf 'ASSET_DIRECTORY=%s\n' "$assets" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: bts-linux-aarch64
          path: ${{ env.ASSET_DIRECTORY }}
          if-no-files-found: error

  publish-release:
    needs: [linux-x86_64, linux-aarch64]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate final manifest and checksums
        run: scripts/build-release assemble release-assets
      - name: Create immutable release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          tag="v${VERSION#v}"
          ref_target=$(git rev-parse HEAD)
          if git rev-parse --verify --quiet "refs/tags/$tag^{commit}" >/dev/null; then
            tag_target=$(git rev-parse "refs/tags/$tag^{commit}")
            [[ "$tag_target" == "$ref_target" ]] || { echo "Tag $tag identifies another commit." >&2; exit 1; }
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a "$tag" -m "BTS ${VERSION#v}"
            git push origin "refs/tags/$tag"
          fi
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          tag="v${VERSION#v}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --draft=false
          else
            arguments=("$tag" --verify-tag --generate-notes)
            [[ "$PRERELEASE" == true ]] && arguments+=(--prerelease)
            gh release create "${arguments[@]}"
          fi
          gh release upload "$tag" release-assets/* --clobber
