name: Publish release candidate

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: publish-candidate-${{ github.event.workflow_run.head_sha }}

jobs:
  inspect:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'release/')
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.inspect.outputs.publish }}
      version: ${{ steps.inspect.outputs.version }}
      commit: ${{ steps.inspect.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: inspect
        name: Inspect release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-version.py check-workspace
          version=$(scripts/release-version.py workspace-version)
          scripts/release-version.py check-branch "${{ github.event.workflow_run.head_branch }}" "$version"
          commit=$(git rev-parse HEAD)
          publish=false

          if [[ $(scripts/release-version.py classify "$version") == candidate ]]; then
            tag="v$version"
            if git rev-parse --verify --quiet "refs/tags/$tag^{commit}" >/dev/null; then
              target=$(git rev-parse "refs/tags/$tag^{commit}")
              if ! gh release view "$tag" >/dev/null 2>&1; then
                git checkout --detach "$target"
                scripts/release-version.py check-workspace
                tagged_version=$(scripts/release-version.py workspace-version)
                [[ "$tagged_version" == "$version" ]] || {
                  echo "Tag $tag contains workspace version $tagged_version." >&2
                  exit 1
                }
                commit=$target
                publish=true
              fi
            else
              publish=true
            fi
          fi

          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  publish:
    needs: inspect
    if: needs.inspect.outputs.publish == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-artifacts.yml
    with:
      version: ${{ needs.inspect.outputs.version }}
      prerelease: true
      ref: ${{ needs.inspect.outputs.commit }}
