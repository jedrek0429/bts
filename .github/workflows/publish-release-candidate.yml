name: Publish release candidate

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: publish-candidate-${{ github.event.workflow_run.head_sha }}

jobs:
  inspect:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'release/')
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.inspect.outputs.publish }}
      version: ${{ steps.inspect.outputs.version }}
      commit: ${{ steps.inspect.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - id: inspect
        name: Inspect release candidate
        run: |
          scripts/release-version.py check-workspace
          version=$(scripts/release-version.py workspace-version)
          scripts/release-version.py check-branch "${{ github.event.workflow_run.head_branch }}" "$version"
          commit=$(git rev-parse HEAD)
          publish=false

          if [[ $(scripts/release-version.py classify "$version") == candidate ]]; then
            tag="v$version"
            if git rev-parse --verify --quiet "refs/tags/$tag^{commit}" >/dev/null; then
              target=$(git rev-parse "refs/tags/$tag^{commit}")
              [[ "$target" == "$commit" ]] || {
                echo "Tag $tag identifies another commit." >&2
                exit 1
              }
            else
              publish=true
            fi
          fi

          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  tag:
    needs: inspect
    if: needs.inspect.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect.outputs.commit }}
          fetch-depth: 0
      - name: Create immutable candidate tag
        env:
          VERSION: ${{ needs.inspect.outputs.version }}
        run: |
          tag="v$VERSION"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$tag" -m "BTS $VERSION"
          git push origin "refs/tags/$tag"

  publish:
    needs: [inspect, tag]
    if: needs.inspect.outputs.publish == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-artifacts.yml
    with:
      version: ${{ needs.inspect.outputs.version }}
      prerelease: true
      ref: ${{ needs.inspect.outputs.commit }}
