              '''                next.write_atomic(&state_path)?;
                state = Some(next);''',
              '''                next.write_atomic(&state_path)?;
                transaction::commit_pending(&cli.root)?;
                state = Some(next);'''
          )
          replace(
              "bts-install/src/main.rs",
              '''                persist_uninstall_state(&state_path, &mut state, next)?;''',
              '''                persist_uninstall_state(&state_path, &mut state, next)?;
                transaction::commit_pending(&cli.root)?;'''
