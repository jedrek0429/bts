                    stop_after_item = true;
                    "sound:beeperr".to_owned()
                }
                Err(error) => {
                    warn!(
                        %channel_id,
                        %error,
                        "failed to read cached voice prompt; playing the emergency error tone and abandoning the incomplete queue"
                    );
                    stop_after_item = true;
                    "sound:beeperr".to_owned()
                }
            },'''
