    menu: &[MediaItem],
    voice: &VoiceCache<KokoroSynthesizer>,
) -> anyhow::Result<()> {
    let mut prompts = static_speech_prompts();
    for item in menu {
        if let MediaItem::Speech(text) = item
            && !prompts.contains(text)
        {
            prompts.push(text.clone());
        }
