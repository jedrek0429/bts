name: Run release completion patch

on:
  push:
    branches: [fix/release-0.3-completion]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix(release): complete 0.3 release gates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-0.3-completion
          fetch-depth: 0
      - name: Execute embedded patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/release-completion-patch.yml').read_text()
          start = workflow.index("          from pathlib import Path\n")
          end = workflow.index("          PY\n", start)
          program = textwrap.dedent(workflow[start:end])
          exec(compile(program, 'release-completion-patch', 'exec'))
          Path('.github/workflows/release-completion-kick.yml').unlink(missing_ok=True)
          PY
      - name: Commit applied patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(release): complete 0.3 release gates"
          git push origin HEAD:fix/release-0.3-completion
