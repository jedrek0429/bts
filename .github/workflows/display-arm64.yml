name: Build ARM64 Display

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'bts-display/**'
      - 'bts-protocol/**'
      - '.github/workflows/display-arm64.yml'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-display-arm64:
    name: BTS Display (ARM64)
    runs-on: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libudev-dev \
            libfontconfig1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build bts-display
        run: cargo build --locked --release -p bts-display

      - name: Package binary
        run: |
          strip target/release/bts-display
          install -Dm755 target/release/bts-display package/bts-display
          tar -C package -czf bts-display-linux-aarch64.tar.gz bts-display
          sha256sum bts-display-linux-aarch64.tar.gz > bts-display-linux-aarch64.tar.gz.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bts-display-linux-aarch64
          path: |
            bts-display-linux-aarch64.tar.gz
            bts-display-linux-aarch64.tar.gz.sha256
          if-no-files-found: error

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              bts-display-linux-aarch64.tar.gz \
              bts-display-linux-aarch64.tar.gz.sha256 \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes \
              bts-display-linux-aarch64.tar.gz \
              bts-display-linux-aarch64.tar.gz.sha256
          fi
