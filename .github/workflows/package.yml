name: Portable release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v0.3.*'

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build and bundle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libwayland-dev libxkbcommon-dev libegl1-mesa-dev \
            libgl1-mesa-dev libudev-dev libfontconfig1-dev zstd
      - name: Build installer and components
        run: cargo build --locked --release --workspace
      - name: Build portable assets
        run: |
          version=${GITHUB_REF_NAME#v}
          assets="$RUNNER_TEMP/release-assets"
          install -d "$assets"
          for component in core display telephony addons; do
            scripts/build-component-bundle \
              "$component" "$version" x86_64 "target/release/bts-$component" "$assets"
          done
          install -m755 target/release/bts-install "$assets/bts-install"
          install -m644 LICENSE "$assets/LICENSE"
          printf 'ASSET_DIRECTORY=%s\n' "$assets" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: bts-linux-x86_64
          path: ${{ env.ASSET_DIRECTORY }}
          if-no-files-found: error

  linux-aarch64-display:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build and bundle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libwayland-dev libxkbcommon-dev libegl1-mesa-dev \
            libgl1-mesa-dev libudev-dev libfontconfig1-dev zstd
      - name: Build ARM64 Display
        run: cargo build --locked --release -p bts-display
      - name: Build ARM64 Display bundle
        run: |
          version=${GITHUB_REF_NAME#v}
          assets="$RUNNER_TEMP/release-assets"
          scripts/build-component-bundle \
            display "$version" aarch64 target/release/bts-display "$assets"
          printf 'ASSET_DIRECTORY=%s\n' "$assets" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: bts-linux-aarch64-display
          path: ${{ env.ASSET_DIRECTORY }}
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v0.3.')
    needs: [linux-x86_64, linux-aarch64-display]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate and validate final manifest and checksums
        run: |
          scripts/generate-release-manifest.py "${GITHUB_REF_NAME#v}" release-assets
          (cd release-assets && sha256sum --check SHA256SUMS)
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --draft=false
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
