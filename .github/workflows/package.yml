name: Portable release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      prerelease:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: Version to package, with or without a leading v
        required: true
        type: string
      prerelease:
        description: Publish as a GitHub prerelease
        required: true
        type: boolean
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ inputs.version || github.ref_name }}

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
  RELEASE_PRERELEASE: ${{ inputs.prerelease || contains(github.ref_name, '-') }}

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release identity
        run: |
          version=${RELEASE_VERSION#v}
          scripts/release-version.py check-workspace
          workspace_version=$(scripts/release-version.py workspace-version)
          [[ "$version" == "$workspace_version" ]] || {
            echo "Release $version does not match workspace version $workspace_version." >&2
            exit 1
          }
          kind=$(scripts/release-version.py classify "$version")
          [[ "$kind" != development ]] || {
            echo "Development versions cannot be published." >&2
            exit 1
          }
          if [[ "$kind" == stable ]]; then
            [[ "$RELEASE_PRERELEASE" == false ]]
          else
            [[ "$RELEASE_PRERELEASE" == true ]]
          fi

  linux-x86_64:
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build and bundle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libwayland-dev libxkbcommon-dev libegl1-mesa-dev \
            libgl1-mesa-dev libudev-dev libfontconfig1-dev zstd
      - name: Build installer and components
        run: cargo build --locked --release --workspace
      - name: Build portable assets
        run: |
          assets="$RUNNER_TEMP/release-assets"
          install -d "$assets"
          for component in core display telephony addons cli; do
            binary="bts-$component"
            [[ "$component" == cli ]] && binary=btscli
            scripts/build-release component \
              "$component" x86_64 "target/release/$binary" "$assets"
          done
          scripts/build-release installer target/release/bts-install "$assets"
          printf 'ASSET_DIRECTORY=%s\n' "$assets" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: bts-linux-x86_64
          path: ${{ env.ASSET_DIRECTORY }}
          if-no-files-found: error

  linux-aarch64-display-and-cli:
    needs: validate-version
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build and bundle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libwayland-dev libxkbcommon-dev libegl1-mesa-dev \
            libgl1-mesa-dev libudev-dev libfontconfig1-dev zstd
      - name: Build ARM64 Display and CLI
        run: cargo build --locked --release -p bts-display -p bts-cli
      - name: Build ARM64 Display and CLI bundles
        run: |
          assets="$RUNNER_TEMP/release-assets"
          scripts/build-release component \
            display aarch64 target/release/bts-display "$assets"
          scripts/build-release component \
            cli aarch64 target/release/btscli "$assets"
          printf 'ASSET_DIRECTORY=%s\n' "$assets" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: bts-linux-aarch64-display-and-cli
          path: ${{ env.ASSET_DIRECTORY }}
          if-no-files-found: error

  publish-release:
    needs: [linux-x86_64, linux-aarch64-display-and-cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate and validate final manifest and checksums
        run: scripts/build-release assemble release-assets
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${RELEASE_VERSION#v}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --draft=false
          else
            arguments=("$tag" --verify-tag --generate-notes)
            if [[ "$RELEASE_PRERELEASE" == true ]]; then
              arguments+=(--prerelease)
            fi
            gh release create "${arguments[@]}"
          fi
          gh release upload "$tag" release-assets/* --clobber
