name: Final corrective rustfmt

on:
  push:
    branches: [fix/release-0.3-gates-final]

permissions:
  contents: write

jobs:
  format:
    # Formatting-only helper; final tree must not retain this workflow.
    if: github.event.head_commit.message != 'style(release): apply canonical rustfmt'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-0.3-gates-final
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit exact rustfmt output and self-delete
        run: |
          rm -f .github/workflows/release-completion-push.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "style(release): apply canonical rustfmt"
          git push origin HEAD:fix/release-0.3-gates-final
