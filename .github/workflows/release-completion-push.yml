name: Apply release completion on branch

on:
  push:
    branches: [fix/release-0.3-completion]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'fix(release): apply audited 0.3 completion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-0.3-completion
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply patch
        run: python3 scripts/apply-release-completion.py
      - name: Format source
        run: cargo fmt --all
      - name: Remove temporary tooling and commit
        run: |
          rm -f scripts/apply-release-completion.py .github/workflows/release-completion-push.yml .github/workflows/release-completion-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(release): apply audited 0.3 completion"
          git push origin HEAD:fix/release-0.3-completion
