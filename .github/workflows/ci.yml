name: CI

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
      base:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        required: true
        type: string
      base:
        required: true
        type: string
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

jobs:
  commit-messages:
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Validate Conventional Commit subjects
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          DISPATCH_BASE: ${{ inputs.base }}
          HEAD: ${{ inputs.ref || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE"
          elif [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            base="$DISPATCH_BASE"
          else
            base="$BEFORE"
          fi
          python3 scripts/check-commit-messages.py "$base" "$HEAD"

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Check
        run: cargo check --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  deployment-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install deployment dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cage seatd shellcheck
      - name: Validate shell scripts
        run: shellcheck scripts/build-release scripts/build-component-bundle scripts/bts-dev scripts/bts-tmux scripts/test-bts-tmux.sh scripts/test-support/fake-tmux scripts/test-release-assets.sh scripts/test-release-version.sh scripts/generate-voice-prompts.sh
      - name: Validate Python release tooling
        run: python3 -m py_compile scripts/generate-release-manifest.py scripts/release-version.py scripts/check-commit-messages.py scripts/test-administrative-boundaries.py
      - name: Validate administrative crate boundaries
        run: python3 scripts/test-administrative-boundaries.py
      - name: Validate release versions
        run: scripts/test-release-version.sh
      - name: Validate development launcher
        run: scripts/test-bts-tmux.sh
      - name: Validate release assets
        run: scripts/test-release-assets.sh
      - name: Build release binaries
        run: cargo build --workspace --release --locked
      - name: Stage packaged filesystem
        run: |
          stage="$RUNNER_TEMP/bts-root"
          version=$(scripts/release-version.py workspace-version)
          install -d "$stage/etc/bts" "$stage/usr/bin" "$stage/usr/lib/systemd/system"
          for component in core addons telephony display; do
            install -Dm755 "target/release/bts-$component" "$stage/usr/lib/bts/components/$component/releases/$version/bin/bts-$component"
            ln -s "releases/$version" "$stage/usr/lib/bts/components/$component/current"
          done
          install -Dm755 target/release/btscli "$stage/usr/bin/btscli"
          install -m755 "$(command -v cage)" "$stage/usr/bin/cage"
          install -m755 "$(command -v rm)" "$stage/usr/bin/rm"
          install -m755 "$(command -v install)" "$stage/usr/bin/install"
          install -m755 "$(command -v env)" "$stage/usr/bin/env"
          install -m755 "$(command -v sh)" "$stage/usr/bin/sh"
          install -m755 /usr/bin/true "$stage/usr/bin/true"
          install -m640 deploy/*.env.example "$stage/etc/bts/"
          install -m644 deploy/systemd/*.service "$stage/usr/lib/systemd/system/"
          install -m644 deploy/systemd/*.target "$stage/usr/lib/systemd/system/"
          cat <<'EOF' > "$stage/etc/passwd"
          root:x:0:0:root:/root:/usr/bin/nologin
          bts:x:973:973:bts:/var/lib/bts:/usr/bin/nologin
          bts-display:x:974:974:bts-display:/var/lib/bts-display:/usr/bin/nologin
          EOF
          cat <<'EOF' > "$stage/etc/group"
          root:x:0:
          bts:x:973:
          bts-display:x:974:
          video:x:39:
          render:x:9730:
          input:x:995:
          seat:x:996:
          EOF
          cp -a /usr/lib/systemd/system/. "$stage/usr/lib/systemd/system/"
          cat <<'EOF' > "$stage/usr/lib/systemd/system/asterisk.service"
          [Unit]
          Description=CI stub for Asterisk
          [Service]
          Type=oneshot
          ExecStart=/usr/bin/true
          RemainAfterExit=yes
          EOF
          printf 'BTS_STAGE_ROOT=%s\n' "$stage" >> "$GITHUB_ENV"
      - name: Validate staged systemd deployment
        run: systemd-analyze --root="$BTS_STAGE_ROOT" --man=no verify bts-core.service bts-addons.service bts-telephony.service bts-display.service bts.target bts-server.target bts-display.target

  release-assets-aarch64:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ARM64 release dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libudev-dev libfontconfig1-dev zstd
      - name: Build ARM64 release binaries
        run: cargo build --locked --release -p bts-display -p bts-cli
      - name: Validate ARM64 release bundles
        run: |
          assets="$RUNNER_TEMP/release-assets"
          scripts/build-release component display aarch64 target/release/bts-display "$assets"
          scripts/build-release component cli aarch64 target/release/btscli "$assets"
          compgen -G "$assets/bts-display-v*-linux-aarch64.tar.zst" >/dev/null
          compgen -G "$assets/bts-cli-v*-linux-aarch64.tar.zst" >/dev/null
