name: Format release follow-up

on:
  push:
    branches: [fix/release-0.3-completion]

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'style(release): apply rustfmt'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-0.3-completion
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatter output and remove helper
        run: |
          rm -f .github/workflows/format-release-followup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "style(release): apply rustfmt"
          git push origin HEAD:fix/release-0.3-completion
