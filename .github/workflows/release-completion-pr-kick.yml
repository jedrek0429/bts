name: Patch release completion PR

on:
  pull_request:
    branches: [release/0.3.x]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/release-0.3-completion' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Execute embedded patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/release-completion-patch.yml').read_text()
          start = workflow.index("          from pathlib import Path\n")
          end = workflow.index("          PY\n", start)
          program = textwrap.dedent(workflow[start:end])
          exec(compile(program, 'release-completion-patch', 'exec'))
          for path in [
              '.github/workflows/release-completion-kick.yml',
              '.github/workflows/release-completion-pr-kick.yml',
          ]:
              Path(path).unlink(missing_ok=True)
          PY
      - name: Commit applied patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(release): complete 0.3 release gates"
          git push origin HEAD:${{ github.head_ref }}
